<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><title>Xác nhận đơn hàng</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;">
<div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;">
  <div style="background:#e53935;padding:24px;text-align:center;">
    <h1 style="color:#fff;margin:0;">KinhDuanPC</h1>
  </div>
  <div style="padding:32px;">
    <h2 style="color:#333;">Đặt hàng thành công!</h2>
    <p>Xin chào <strong th:text="${name}">Khách hàng</strong>,</p>
    <p>Đơn hàng <strong th:text="${orderCode}" style="color:#e53935;">HC-2026-000001</strong> của bạn đã được tiếp nhận.</p>
    <div style="background:#f8f8f8;border-radius:8px;padding:20px;margin:20px 0;">
      <p style="margin:0;color:#666;">Tổng thanh toán:</p>
      <p style="margin:4px 0 0;font-size:24px;font-weight:bold;color:#e53935;" th:text="${totalAmount + ' đ'}">0 đ</p>
    </div>
    <a th:href="${orderLink}" style="display:block;text-align:center;background:#e53935;color:#fff;padding:14px;border-radius:6px;text-decoration:none;font-weight:bold;">
      Xem chi tiết đơn hàng
    </a>
  </div>
  <div style="background:#f8f8f8;padding:16px;text-align:center;color:#999;font-size:12px;">
    © 2026 KinhDuanPC | Hotline: 1900 1903
  </div>
</div>
</body>
</html>
