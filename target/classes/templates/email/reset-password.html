<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;">
<div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;">
  <div style="background:#e53935;padding:24px;text-align:center;">
    <h1 style="color:#fff;margin:0;">KinhDuanPC</h1>
  </div>
  <div style="padding:32px;">
    <h2>Đặt lại mật khẩu</h2>
    <p>Xin chào <strong th:text="${name}">Bạn</strong>,</p>
    <p>Nhấn vào nút bên dưới để đặt lại mật khẩu. Link có hiệu lực trong <strong>15 phút</strong>.</p>
    <a th:href="${resetLink}" style="display:block;text-align:center;background:#e53935;color:#fff;padding:14px;border-radius:6px;text-decoration:none;font-weight:bold;margin:24px 0;">
      Đặt lại mật khẩu
    </a>
    <p style="color:#999;font-size:13px;">Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này.</p>
  </div>
</div>
</body>
</html>
